<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="苹果纪年图标">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242428"/>
      <stop offset="0.55" stop-color="#121214"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>

    <linearGradient id="line" x1="104" y1="372" x2="408" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ac8fa"/>
      <stop offset="0.35" stop-color="#0a84ff"/>
      <stop offset="0.7" stop-color="#bf5af2"/>
      <stop offset="1" stop-color="#ff375f"/>
    </linearGradient>

    <radialGradient id="sheen" cx="0.3" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <filter id="dotGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#sheen)"/>
  <rect x="0.75" y="0.75" width="510.5" height="510.5" rx="114.5"
        fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- timeline curve glow -->
  <path d="M104 372 C150 372 170 352 196 332 C232 304 244 300 272 282
           C306 260 320 240 348 208 C372 180 386 166 408 148"
        fill="none" stroke="url(#line)" stroke-width="30"
        stroke-linecap="round" filter="url(#soft)" opacity="0.45"/>

  <!-- timeline curve -->
  <path d="M104 372 C150 372 170 352 196 332 C232 304 244 300 272 282
           C306 260 320 240 348 208 C372 180 386 166 408 148"
        fill="none" stroke="url(#line)" stroke-width="13"
        stroke-linecap="round"/>

  <!-- era nodes -->
  <g>
    <circle cx="108" cy="370" r="9" fill="#ffffff"/>
    <circle cx="196" cy="332" r="10" fill="#ffffff"/>
    <circle cx="272" cy="282" r="11" fill="#ffffff"/>
    <circle cx="348" cy="208" r="12" fill="#ffffff"/>
    <circle cx="406" cy="150" r="16" fill="#ffffff" opacity="0.35" filter="url(#dotGlow)"/>
    <circle cx="406" cy="150" r="13" fill="#ffffff"/>
  </g>
</svg>
